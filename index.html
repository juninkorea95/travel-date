<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>컨딩 날짜 맞추기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
</head><body>
<style>
/* Layout: one narrow column — name, sticky marker palette, January and February calendars, submit. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --fg:#17262b; --muted:#5d7076; --line:#d7e1e2; --accent:#0f7c86;
  --ok:#2f6fe0; --maybe:#e0a400; --no:#d9443a; --holiday:#b2557a; --empty:#eef3f3;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --fg:#e4eded; --muted:#93a6aa; --line:#2a3a3e; --accent:#4fc1c9;
  --ok:#5b8ff0; --maybe:#f0c23c; --no:#ec665c; --holiday:#e08aad; --empty:#1d2a2d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --fg:#e4eded; --muted:#93a6aa; --line:#2a3a3e; --accent:#4fc1c9;
  --ok:#5b8ff0; --maybe:#f0c23c; --no:#ec665c; --holiday:#e08aad; --empty:#1d2a2d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label.lbl{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.02em}
input[type=text],textarea{width:100%;font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.palette{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
.marker{border:2px solid transparent;border-radius:11px;padding:10px 4px;font:600 14px var(--body);cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.marker small{font-weight:500;font-size:11px;opacity:.9}
.marker[data-v="1"]{background:var(--ok)}
.marker[data-v="2"]{background:var(--maybe);color:#2a2100}
.marker[data-v="3"]{background:var(--no)}
.marker[data-v="0"]{background:var(--empty);color:var(--fg);border-color:var(--line)}
.marker[aria-pressed="true"]{border-color:var(--fg);transform:translateY(-1px);box-shadow:0 0 0 2px var(--surface) inset}
.hint{font-size:13px;color:var(--muted);margin:0}

.month h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.dow.sun{color:var(--no)} .dow.sat{color:var(--ok)}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--empty);border-radius:9px;
  font:600 15px var(--body);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;
  font-variant-numeric:tabular-nums;transition:transform .08s;touch-action:manipulation}
.day:active{transform:scale(.94)}
.day.sun{color:var(--no)} .day.sat{color:var(--ok)}
.day .tag{font-size:9px;font-weight:600;color:var(--holiday);line-height:1}
.day.s1{background:var(--ok);border-color:var(--ok);color:#fff}
.day.s2{background:var(--maybe);border-color:var(--maybe);color:#2a2100}
.day.s3{background:var(--no);border-color:var(--no);color:#fff}
.day.s1 .tag,.day.s3 .tag{color:#fff} .day.s2 .tag{color:#2a2100}
.blank{aspect-ratio:1/1}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--body);padding:8px 12px;border-radius:9px;cursor:pointer}
.counts{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.submit{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font:600 16px var(--body);padding:14px 16px;border-radius:12px}
.submit[aria-disabled="true"]{opacity:.45;pointer-events:none}
.summary{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.warn{font-size:13px;color:var(--no);margin:0;min-height:1.2em}
@media (prefers-reduced-motion:reduce){.day,.marker{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>컨딩 여행, <span>되는 날</span> 칠하기</h1>
    <p class="lede">마커 색을 고르고 2027년 1월·2월 달력에서 날짜를 눌러 칠해줘. 다 칠하면 맨 아래 제출 버튼!</p>
  </header>

  <div class="card">
    <label class="lbl" for="name">이름</label>
    <input type="text" id="name" placeholder="예: 준" maxlength="12" autocomplete="off">
  </div>

  <div class="palette" role="group" aria-label="마커 고르기">
    <button class="marker" data-v="1" aria-pressed="true">파랑<small>확실히 됨</small></button>
    <button class="marker" data-v="2" aria-pressed="false">노랑<small>애매함</small></button>
    <button class="marker" data-v="3" aria-pressed="false">빨강<small>절대 안 됨</small></button>
    <button class="marker" data-v="0" aria-pressed="false">지우개<small>칠 지우기</small></button>
  </div>
  <p class="hint">같은 색으로 한 번 더 누르면 지워져.</p>

  <div class="card">
    <div id="cal"></div>
    <div class="row">
      <button class="btn" id="fillRest">안 칠한 날 전부 지금 마커로</button>
      <button class="btn" id="reset">전부 지우기</button>
    </div>
    <div class="counts" id="counts"></div>
  </div>

  <div class="card">
    <label class="lbl" for="reason">애매하거나 안 되는 이유 (선택)</label>
    <textarea id="reason" placeholder="예: 2월 초 임용 발표 / 회사 휴가 12월 확정"></textarea>
  </div>

  <div class="card">
    <p class="summary" id="summary"></p>
    <p class="warn" id="warn"></p>
    <a class="submit" id="submit" href="#" target="_blank" rel="noopener" aria-disabled="true">제출하기</a>
    <p class="hint">제출하기를 누르면 새 창이 열려. 거기서 한 번 더 <b>제출</b>을 누르면 저장 완료. 다시 칠해서 또 제출하면 마지막 것만 반영돼.</p>
  </div>
</div>

<script>
(function(){
  const START=new Date(2027,0,1), DAYS=59;
  const FORM="https://tally.so/r/9NBEaQ";
  const TAGS={"0-1":"신정","1-6":"설","1-7":"설","1-8":"설","1-9":"설"};
  const DOW=["일","월","화","수","목","금","토"];
  const KEY="kenting-dates-v2";
  const $=id=>document.getElementById(id);
  const dateOf=i=>new Date(2027,0,1+i);
  const short=i=>{const d=dateOf(i);return (d.getMonth()+1)+"/"+d.getDate();};

  let state=new Array(DAYS).fill(0), pen=1;
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&Array.isArray(s.state)&&s.state.length===DAYS){state=s.state;$("name").value=s.name||"";$("reason").value=s.reason||"";}}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({state,name:$("name").value,reason:$("reason").value}));}catch(e){}};

  document.querySelectorAll(".marker").forEach(m=>m.addEventListener("click",()=>{
    pen=+m.dataset.v; document.querySelectorAll(".marker").forEach(x=>x.setAttribute("aria-pressed",x===m));
  }));

  function build(){
    const host=$("cal"); host.innerHTML="";
    [0,1].forEach(m=>{
      const wrap=document.createElement("div"); wrap.className="month";
      if(m===1) wrap.style.marginTop="18px";
      const h=document.createElement("h2"); h.textContent="2027년 "+(m+1)+"월"; wrap.appendChild(h);
      const g=document.createElement("div"); g.className="grid";
      DOW.forEach((d,k)=>{const e=document.createElement("div");e.className="dow"+(k===0?" sun":k===6?" sat":"");e.textContent=d;g.appendChild(e);});
      const first=new Date(2027,m,1).getDay();
      for(let k=0;k<first;k++){const b=document.createElement("div");b.className="blank";g.appendChild(b);}
      const len=new Date(2027,m+1,0).getDate();
      for(let d=1;d<=len;d++){
        const i=Math.round((new Date(2027,m,d)-START)/86400000);
        const dw=new Date(2027,m,d).getDay();
        const b=document.createElement("button"); b.type="button";
        b.className="day s"+state[i]+(dw===0?" sun":dw===6?" sat":"");
        b.setAttribute("aria-label",(m+1)+"월 "+d+"일");
        b.innerHTML="<span>"+d+"</span>"+(TAGS[m+"-"+d]?'<span class="tag">'+TAGS[m+"-"+d]+"</span>":"");
        b.addEventListener("click",()=>{
          state[i]=(state[i]===pen)?0:pen;
          b.className="day s"+state[i]+(dw===0?" sun":dw===6?" sat":"");
          update();
        });
        g.appendChild(b);
      }
      wrap.appendChild(g); host.appendChild(wrap);
    });
  }

  function ranges(val){
    const out=[];let s=-1;
    for(let i=0;i<=DAYS;i++){
      if(i<DAYS&&state[i]===val){if(s<0)s=i;}
      else if(s>=0){out.push(s===i-1?short(s):short(s)+"~"+short(i-1));s=-1;}
    }
    return out.length?out.join(", "):"없음";
  }

  function update(){
    const c=[0,0,0,0]; state.forEach(v=>c[v]++);
    $("counts").innerHTML="<span>🔵 "+c[1]+"일</span><span>🟡 "+c[2]+"일</span><span>🔴 "+c[3]+"일</span><span>안 칠함 "+c[0]+"일</span>";
    const name=$("name").value.trim(), reason=$("reason").value.trim();
    const blue=ranges(1), yellow=ranges(2), red=ranges(3);
    $("summary").textContent="🔵 확실: "+blue+"\n🟡 애매: "+yellow+"\n🔴 불가: "+red;
    const ok=name.length>0 && (c[1]+c[2]+c[3])>0;
    $("warn").textContent = !name? "이름을 먼저 써줘." : (c[1]+c[2]+c[3])===0? "달력에 하나 이상 칠해줘." : "";
    const p=new URLSearchParams({name,code:state.join(""),blue,yellow,red,reason:reason||"-"});
    $("submit").href=FORM+"?"+p.toString();
    $("submit").setAttribute("aria-disabled",ok?"false":"true");
    save();
  }

  $("fillRest").addEventListener("click",()=>{state=state.map(x=>x===0?pen:x);build();update();});
  $("reset").addEventListener("click",()=>{state=state.map(()=>0);build();update();});
  $("name").addEventListener("input",update);
  $("reason").addEventListener("input",update);
  build(); update();
})();
</script>
</body></html>
